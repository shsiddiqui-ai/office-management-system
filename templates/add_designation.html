<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Designation</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 5%;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .buttons {
            margin-top: 25px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 10px;
            text-decoration: none;
            color: #374151;
        }

    </style>

</head>

<body>

    <div class="header">
        <h1>Add Designation</h1>
    </div>

    <div class="container">

        <div class="card">

            <form method="POST">

                <label>Designation Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Assistant Engineer"
                    required
                >

                <div class="buttons">

                    <button type="submit" class="btn">
                        Save Designation
                    </button>

                    <a href="/admin/designations" class="cancel">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
